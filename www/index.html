<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="命令助手">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <title>命令助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 背景装饰 -->
    <div id="bg-pattern"></div>

    <!-- 主界面（全屏，无悬浮球） -->
    <div id="panel" class="open">
        <div id="panel-header">
            <span class="panel-title">⛏ 命令助手</span>
            <span id="match-count">0 条命令</span>
            <button id="btn-settings" class="head-btn" title="设置">⚙</button>
        </div>

        <!-- 参数槽（当前命令的参数结构） -->
        <div id="cmd-slots"></div>

        <!-- 命令列表（自动补全候选） -->
        <div id="cmd-list"></div>

        <!-- 底部：输入栏 + 复制 -->
        <div id="panel-footer">
            <input type="text" id="cmd-input" placeholder="输入关键字，如 s / give / tp" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button id="btn-copy" class="foot-btn copy" title="复制到剪贴板">复制</button>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal">
        <div class="settings-box">
            <h3>⚙ 设置</h3>

            <!-- 检查更新 -->
            <div class="setting-row">
                <label>应用更新</label>
                <button id="btn-check-update" class="mc-btn small">检查更新</button>
                <div id="update-status" class="setting-tip"></div>
            </div>

            <!-- 版本信息 -->
            <div class="setting-tip">命令助手 v1.2 · PWA 离线可用</div>

            <button id="btn-close-settings" class="mc-btn">完成</button>
        </div>
    </div>

    <!-- 更新提示弹窗 -->
    <div id="update-modal">
        <div class="settings-box">
            <h3>🔄 发现新版本</h3>
            <p id="update-info" class="setting-tip"></p>
            <div class="seg-group">
                <button id="btn-update-now" class="mc-btn">立即更新</button>
                <button id="btn-update-later" class="seg-btn">稍后</button>
            </div>
        </div>
    </div>

    <!-- 复制成功提示 -->
    <div id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/ctree.js"></script>
    <script src="js/app.js"></script>
    <script>
        // 注册 Service Worker + 更新检测
        if ('serviceWorker' in navigator) {
            let newSW = null;

            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
                    // 有更新时提示
                    registration.addEventListener('updatefound', function() {
                        newSW = registration.installing;
                        if (newSW) {
                            newSW.addEventListener('statechange', function() {
                                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                    // 弹出更新提示
                                    document.getElementById('update-info').textContent =
                                        '新版本已下载，重启应用后生效';
                                    document.getElementById('update-modal').classList.add('open');
                                }
                            });
                        }
                    });
                });

                // 手动检查更新
                document.getElementById('btn-check-update').addEventListener('click', function() {
                    const statusEl = document.getElementById('update-status');
                    statusEl.textContent = '检查中...';
                    if (navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({ type: 'CHECK_UPDATE' });
                    }
                    navigator.serviceWorker.getRegistration().then(function(reg) {
                        if (reg) {
                            reg.update().then(function() {
                                setTimeout(function() {
                                    if (reg.waiting) {
                                        statusEl.textContent = '发现新版本！';
                                        document.getElementById('update-info').textContent =
                                            '新版本已下载，重启应用后生效';
                                        document.getElementById('update-modal').classList.add('open');
                                    } else {
                                        statusEl.textContent = '已是最新版';
                                    }
                                }, 1500);
                            });
                        }
                    });
                });

                // 立即更新
                document.getElementById('btn-update-now').addEventListener('click', function() {
                    if (newSW) {
                        newSW.postMessage({ type: 'SKIP_WAITING' });
                        location.reload();
                    } else {
                        location.reload();
                    }
                });

                // 稍后
                document.getElementById('btn-update-later').addEventListener('click', function() {
                    document.getElementById('update-modal').classList.remove('open');
                });
            });

            // SW 激活后刷新
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                // 不自动刷新，让用户自己决定
            });
        }

        // visualViewport 监听：键盘弹出时调整可视区
        function initViewport() {
            const panel = document.getElementById('panel');
            if ('visualViewport' in window) {
                window.visualViewport.addEventListener('resize', function() {
                    // 键盘弹出时 offsetTop 变大，height 变小
                    const vv = window.visualViewport;
                    const heightOffset = window.innerHeight - vv.height;
                    if (heightOffset > 50) {
                        // 键盘弹出：用 visualViewport 的高度
                        panel.style.height = vv.height + 'px';
                        panel.style.top = vv.offsetTop + 'px';
                    } else {
                        // 键盘收起：恢复全屏
                        panel.style.height = '';
                        panel.style.top = '';
                    }
                });
                window.visualViewport.addEventListener('scroll', function() {
                    const vv = window.visualViewport;
                    const heightOffset = window.innerHeight - vv.height;
                    if (heightOffset > 50) {
                        panel.style.top = vv.offsetTop + 'px';
                    }
                });
            }
        }
        document.addEventListener('DOMContentLoaded', initViewport);
    </script>
</body>
</html>

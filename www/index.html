<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>命令助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 背景装饰 -->
    <div id="bg-pattern"></div>

    <!-- 大窗口 -->
    <div id="panel">
        <div id="panel-header">
            <span class="panel-title">⛏ 命令助手</span>
            <span id="match-count">0 条命令</span>
        </div>

        <!-- 参数槽（当前命令的参数结构） -->
        <div id="cmd-slots"></div>

        <!-- 命令列表（自动补全候选） -->
        <div id="cmd-list"></div>

        <!-- 底部：设置 + 输入栏 + 复制 -->
        <div id="panel-footer">
            <button id="btn-settings" class="foot-btn" title="设置">⚙</button>
            <input type="text" id="cmd-input" placeholder="输入关键字，如 s / give / tp" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button id="btn-copy" class="foot-btn copy" title="复制到剪贴板">复制</button>
        </div>
    </div>

    <!-- 悬浮球（永远在最上层） -->
    <div id="float-ball" title="点击展开/收起，拖动移动">
        <span class="ball-icon">⌘</span>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal">
        <div class="settings-box">
            <h3>⚙ 设置</h3>

            <div class="setting-row">
                <label>悬浮图标透明度</label>
                <div class="slider-row">
                    <input type="range" id="ball-alpha" min="20" max="100" value="100">
                    <span class="slider-val" id="ball-alpha-val">100%</span>
                </div>
            </div>

            <div class="setting-row">
                <label>大窗口透明度</label>
                <div class="slider-row">
                    <input type="range" id="panel-alpha" min="20" max="100" value="95">
                    <span class="slider-val" id="panel-alpha-val">95%</span>
                </div>
            </div>

            <div class="setting-tip">透明度设置自动保存，重开应用后依然生效</div>

            <button id="btn-close-settings" class="mc-btn">完成</button>
        </div>
    </div>

    <!-- 复制成功提示 -->
    <div id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/ctree.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

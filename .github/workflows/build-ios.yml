name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 安装依赖
      run: npm install

    - name: 同步 Capacitor iOS 项目
      run: |
        npx cap add ios || true
        npx cap sync ios
        cd ios/App && pod install && cd ../..

    - name: 查看可用 Xcode 版本
      run: |
        ls /Applications/ | grep Xcode
        xcode-select -p
        xcodebuild -version

    - name: 读取应用配置
      id: config
      run: |
        APP_NAME=$(node -e "console.log(require('./capacitor.config.json').appName)")
        APP_ID=$(node -e "console.log(require('./capacitor.config.json').appId)")
        echo "appName=$APP_NAME" >> $GITHUB_OUTPUT
        echo "appId=$APP_ID" >> $GITHUB_OUTPUT
        echo "应用名: $APP_NAME"
        echo "Bundle ID: $APP_ID"

    - name: 编译 iOS 应用（Ad-hoc 签名）
      run: |
        xcodebuild -workspace "ios/App/App.xcworkspace" \
          -scheme "App" \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=YES \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          PRODUCT_BUNDLE_IDENTIFIER="${{ steps.config.outputs.appId }}" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          PROVISIONING_PROFILE=""

    - name: 打包 IPA（Python 重写，清除所有签名）
      run: |
        APP_ROOT="build/Build/Products/Release-iphoneos"
        APP_DIR=$(ls -d "$APP_ROOT"/*.app | head -n 1)
        echo "App 目录: $APP_DIR"

        echo "=== Python 重写 IPA ==="
        cat > clean_ipa.py << 'PYEOF'
import os, zipfile, glob, sys

app_dirs = glob.glob("build/Build/Products/Release-iphoneos/*.app")
if not app_dirs:
    print("ERROR: no .app found!")
    sys.exit(1)
app_dir = app_dirs[0]
print("App dir: " + app_dir)

print("\n=== Scanning for signatures ===")
for root, dirs, files in os.walk(app_dir, followlinks=False):
    for d in dirs:
        if d == "_CodeSignature":
            print("  FOUND: " + os.path.join(root, d))
    for f in files:
        if f.endswith(".mobileprovision") or f.endswith(".entitlements"):
            print("  FOUND: " + os.path.join(root, f))

files_to_add = []
skip_count = 0
SKIP_DIRS = {"_CodeSignature", "__MACOSX"}
SKIP_EXTS = (".mobileprovision", ".entitlements")

for root, dirs, files in os.walk(app_dir, followlinks=False):
    dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
    for f in files:
        full = os.path.join(root, f)
        rel = os.path.relpath(full, app_dir).replace(os.sep, "/")
        if f.endswith(SKIP_EXTS) or "_CodeSignature" in rel:
            print("  SKIP: " + rel)
            skip_count += 1
            continue
        zip_path = "Payload/" + os.path.basename(app_dir) + "/" + rel
        files_to_add.append((zip_path, full))

print("\nSkipped: %d, Adding: %d" % (skip_count, len(files_to_add)))

ipa_path = "command-helper.ipa"
if os.path.exists(ipa_path):
    os.remove(ipa_path)

with zipfile.ZipFile(ipa_path, "w", zipfile.ZIP_DEFLATED) as zf:
    for zp, fp in files_to_add:
        zf.write(fp, zp)

print("\nIPA written: %s (%d bytes)" % (ipa_path, os.path.getsize(ipa_path)))

print("\n=== Verification ===")
with zipfile.ZipFile(ipa_path, "r") as zf:
    names = zf.namelist()
    has_cs = any("_CodeSignature" in n for n in names)
    has_mp = any(".mobileprovision" in n for n in names)
    has_ent = any(".entitlements" in n for n in names)
    has_info = any("Info.plist" in n for n in names)
    print("  Total files: %d" % len(names))
    print("  _CodeSignature:    %s" % ("FAIL - STILL EXISTS!" if has_cs else "OK - clean"))
    print("  mobileprovision:   %s" % ("FAIL - STILL EXISTS!" if has_mp else "OK - clean"))
    print("  entitlements:      %s" % ("FAIL - STILL EXISTS!" if has_ent else "OK - clean"))
    print("  Info.plist:        %s" % ("OK" if has_info else "FAIL - MISSING!"))
    if has_cs or has_mp:
        print("\nResidual paths:")
        for n in names:
            if "_CodeSignature" in n or ".mobileprovision" in n:
                print("  " + n)
        sys.exit(1)
    print("\nALL CLEAN!")
PYEOF
        python3 clean_ipa.py

        echo ""
        echo "=== Final check ==="
        ls -lh command-helper.ipa

    - name: 上传 IPA 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "命令助手-ios"
        path: command-helper.ipa
        retention-days: 30

    - name: 创建 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: command-helper.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

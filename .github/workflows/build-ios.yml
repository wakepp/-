name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 安装依赖
      run: npm install

    - name: 同步 Capacitor iOS 项目
      run: |
        npx cap add ios || true
        npx cap sync ios
        cd ios/App && pod install && cd ../..

    - name: 查看可用 Xcode 版本
      run: |
        ls /Applications/ | grep Xcode
        xcode-select -p
        xcodebuild -version

    - name: 读取应用配置
      id: config
      run: |
        APP_NAME=$(node -e "console.log(require('./capacitor.config.json').appName)")
        APP_ID=$(node -e "console.log(require('./capacitor.config.json').appId)")
        echo "appName=$APP_NAME" >> $GITHUB_OUTPUT
        echo "appId=$APP_ID" >> $GITHUB_OUTPUT
        echo "应用名: $APP_NAME"
        echo "Bundle ID: $APP_ID"

    - name: 编译 iOS 应用（Ad-hoc 签名，稳定编译）
      run: |
        xcodebuild -workspace "ios/App/App.xcworkspace" \
          -scheme "App" \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=YES \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          PRODUCT_BUNDLE_IDENTIFIER="${{ steps.config.outputs.appId }}" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          PROVISIONING_PROFILE=""

    - name: 打包 IPA（解压→删签名→重打包）
      run: |
        APP_ROOT="build/Build/Products/Release-iphoneos"
        APP_DIR=$(ls -d "$APP_ROOT"/*.app | head -n 1)
        echo "App 目录: $APP_DIR"

        rm -rf Payload command-helper.ipa
        mkdir -p Payload
        cp -R "$APP_DIR" Payload/

        # 确保可执行权限
        APP_PATH=$(ls -d Payload/*.app | head -n 1)
        EXE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
        chmod +x "$APP_PATH/$EXE_NAME"
        [ -d "$APP_PATH/Frameworks" ] && find "$APP_PATH/Frameworks" -type f -exec chmod +x {} \; 2>/dev/null || true

        xattr -rc Payload 2>/dev/null || true

        # ====== 关键：在文件系统上彻底删除签名 ======
        echo "=== 第一步：文件系统层删除 ==="
        find Payload -type d -name '_CodeSignature' -print -exec rm -rf {} + 2>/dev/null || true
        find Payload -type f -name '*.mobileprovision' -print -delete 2>/dev/null || true
        find Payload -type f -name '*.entitlements' -print -delete 2>/dev/null || true

        # ====== 第二步：打包成 zip ======
        zip -r -X -q command-helper.ipa Payload -x "*.DS_Store" "__MACOSX*"
        echo "打包完成"

        # ====== 第三步：解压到临时目录验证并二次删除 ======
        echo "=== 解压验证 ==="
        rm -rf verify_dir
        mkdir verify_dir
        cd verify_dir
        unzip -q ../command-helper.ipa
        echo "解压目录结构:"
        ls -la Payload/
        ls -la Payload/*.app/
        echo "--- 再删一遍 ---"
        find . -type d -name '_CodeSignature' -print -exec rm -rf {} + 2>/dev/null || true
        find . -type f -name '*.mobileprovision' -print -delete 2>/dev/null || true
        find . -type f -name '*.entitlements' -print -delete 2>/dev/null || true
        echo "--- codesign remove ---"
        codesign --remove-signature Payload/*.app 2>/dev/null || true
        find Payload -type f -name '*.dylib' -exec codesign --remove-signature {} \; 2>/dev/null || true

        # ====== 第四步：重新打包干净的 IPA ======
        rm -f ../command-helper.ipa
        zip -r -X -q ../command-helper.ipa Payload -x "*.DS_Store" "__MACOSX*"
        cd ..
        rm -rf verify_dir Payload

        # ====== 第五步：最终验证 ======
        echo "=== 最终验证 ==="
        echo "文件大小:"
        ls -lh command-helper.ipa
        echo "zip 内容检查:"
        unzip -l command-helper.ipa | head -n 25
        echo ""
        if unzip -l command-helper.ipa | grep -qi 'codesignature'; then
          echo "❌ 仍有 _CodeSignature！"
          exit 1
        else
          echo "✅ 无 _CodeSignature"
        fi
        if unzip -l command-helper.ipa | grep -qi 'mobileprovision'; then
          echo "❌ 仍有 mobileprovision！"
          exit 1
        else
          echo "✅ 无 mobileprovision"
        fi
        if unzip -l command-helper.ipa | grep -qi '\.dylib'; then
          echo "❌ 仍有 .dylib（Frameworks 动态库）！爱思助手可能签不动"
          unzip -l command-helper.ipa | grep -i dylib
        else
          echo "✅ 无 .dylib（Pods 已静态编译）"
        fi
        if unzip -l command-helper.ipa | grep -qi '\.framework/'; then
          echo "⚠️ 仍有 .framework 目录，检查内容:"
          unzip -l command-helper.ipa | grep -i framework
        fi

    - name: 上传 IPA 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "命令助手-ios"
        path: command-helper.ipa
        retention-days: 30

    - name: 创建 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: command-helper.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 安装依赖
      run: npm install

    - name: 同步 Capacitor iOS 项目
      run: |
        npx cap add ios || true
        npx cap sync ios
        cd ios/App && pod install && cd ../..

    - name: 查看可用 Xcode 版本
      run: |
        ls /Applications/ | grep Xcode
        xcode-select -p
        xcodebuild -version

    - name: 读取应用配置
      id: config
      run: |
        APP_NAME=$(node -e "console.log(require('./capacitor.config.json').appName)")
        APP_ID=$(node -e "console.log(require('./capacitor.config.json').appId)")
        echo "appName=$APP_NAME" >> $GITHUB_OUTPUT
        echo "appId=$APP_ID" >> $GITHUB_OUTPUT
        echo "应用名: $APP_NAME"
        echo "Bundle ID: $APP_ID"

    - name: 编译 iOS 应用（Ad-hoc 签名，稳定编译）
      run: |
        xcodebuild -workspace "ios/App/App.xcworkspace" \
          -scheme "App" \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=YES \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          PRODUCT_BUNDLE_IDENTIFIER="${{ steps.config.outputs.appId }}" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          PROVISIONING_PROFILE=""

    - name: 打包 IPA（用 Python 重写，确保无签名残留）
      run: |
        APP_ROOT="build/Build/Products/Release-iphoneos"
        APP_DIR=$(ls -d "$APP_ROOT"/*.app | head -n 1)
        echo "App 目录: $APP_DIR"
        ls -la "$APP_DIR"
        echo ""
        echo "Frameworks 内容:"
        [ -d "$APP_DIR/Frameworks" ] && ls -la "$APP_DIR/Frameworks" || echo "(无 Frameworks)"

        # ====== 用 Python 重写 IPA，彻底清除签名 ======
        echo ""
        echo "=== Python 重写 IPA ==="
        python3 << 'PYEOF'
import os, zipfile, io, shutil

app_dir = os.environ.get("APP_DIR", None)
if not app_dir:
    import sys
    # Fallback
    import glob
    app_dir = glob.glob("build/Build/Products/Release-iphoneos/*.app")[0]

print(f"App 目录: {app_dir}")

# 收集所有要打包的文件，过滤签名相关
files_to_add = []
skip_count = 0

for root, dirs, files in os.walk(app_dir):
    # 跳过整个 _CodeSignature 目录
    if '_CodeSignature' in root.split(os.sep):
        print(f"  SKIP DIR: {root}")
        dirs[:] = []
        skip_count += 1
        continue
    
    for d in dirs:
        if d == '_CodeSignature':
            print(f"  SKIP DIR: {os.path.join(root, d)}")
            dirs.remove(d)
            skip_count += 1
    
    for f in files:
        full = os.path.join(root, f)
        rel = os.path.relpath(full, os.path.dirname(app_dir))
        
        # 跳过签名文件
        if f.endswith('.mobileprovision'):
            print(f"  SKIP: {rel}")
            skip_count += 1
            continue
        if f.endswith('.entitlements'):
            print(f"  SKIP: {rel}")
            skip_count += 1
            continue
        
        files_to_add.append((rel, full))

print(f"\n跳过了 {skip_count} 个签名相关文件/目录")
print(f"添加 {len(files_to_add)} 个文件到新 IPA")

# 打包新 IPA
os.makedirs("Payload_tmp", exist_ok=True)
ipa_path = "command-helper.ipa"

with zipfile.ZipFile(ipa_path, "w", zipfile.ZIP_DEFLATED) as zf:
    for rel, full in files_to_add:
        zf.write(full, rel)

print(f"\n✅ 新 IPA 写入: {ipa_path} ({os.path.getsize(ipa_path)} bytes)")

# 验证
print("\n=== 验证新 IPA 内容 ===")
with zipfile.ZipFile(ipa_path, "r") as zf:
    names = zf.namelist()
    
    # 检查残留
    has_cs = any("_CodeSignature" in n for n in names)
    has_mp = any(".mobileprovision" in n for n in names)
    has_dy = any(".dylib" in n for n in names)
    has_info = any("Info.plist" in n for n in names)
    
    print(f"  总文件数: {len(names)}")
    print(f"  _CodeSignature:    {'❌ 仍有!' if has_cs else '✅ 无'}")
    print(f"  mobileprovision:   {'❌ 仍有!' if has_mp else '✅ 无'}")
    print(f"  Info.plist:        {'✅ 存在' if has_info else '❌ 缺失!'}")
    print(f"  .dylib 数量:       {sum(1 for n in names if '.dylib' in n)}")
    print(f"  .framework 数量:   {sum(1 for n in names if '.framework/' in n)}")
    
    if has_cs or has_mp:
        print("\n❌❌❌ 还有残留！构建失败！")
        sys.exit(1)
    else:
        print("\n✅✅✅ 无任何签名残留！")

PYEOF
        echo ""
        echo "=== 最终检查 ==="
        ls -lh command-helper.ipa
        echo ""
        unzip -l command-helper.ipa | head -n 30

    - name: 上传 IPA 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "命令助手-ios"
        path: command-helper.ipa
        retention-days: 30

    - name: 创建 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: command-helper.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 安装依赖
      run: npm install

    - name: 同步 Capacitor iOS 项目
      run: |
        npx cap add ios || true
        npx cap sync ios
        cd ios/App && pod install && cd ../..

    - name: 查看可用 Xcode 版本
      run: |
        ls /Applications/ | grep Xcode
        xcode-select -p
        xcodebuild -version

    - name: 读取应用配置
      id: config
      run: |
        APP_NAME=$(node -e "console.log(require('./capacitor.config.json').appName)")
        APP_ID=$(node -e "console.log(require('./capacitor.config.json').appId)")
        echo "appName=$APP_NAME" >> $GITHUB_OUTPUT
        echo "appId=$APP_ID" >> $GITHUB_OUTPUT
        echo "应用名: $APP_NAME"
        echo "Bundle ID: $APP_ID"

    - name: 编译 iOS 应用（Ad-hoc 签名）
      run: |
        xcodebuild -workspace "ios/App/App.xcworkspace" \
          -scheme "App" \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=YES \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          PRODUCT_BUNDLE_IDENTIFIER="${{ steps.config.outputs.appId }}" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          PROVISIONING_PROFILE=""

    - name: 用 Python 脚本重写 IPA，清除所有签名残留
      run: python3 scripts/clean_ipa.py

    - name: 最终检查
      run: ls -lh command-helper.ipa

    - name: 上传 IPA 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "命令助手-ios"
        path: command-helper.ipa
        retention-days: 30

    - name: 创建 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: command-helper.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 安装依赖
      run: npm install

    - name: 同步 Capacitor iOS 项目
      run: |
        npx cap add ios || true
        npx cap sync ios
        cd ios/App && pod install && cd ../..

    - name: 查看可用 Xcode 版本
      run: |
        ls /Applications/ | grep Xcode
        xcode-select -p
        xcodebuild -version

    - name: 读取应用配置
      id: config
      run: |
        APP_NAME=$(node -e "console.log(require('./capacitor.config.json').appName)")
        APP_ID=$(node -e "console.log(require('./capacitor.config.json').appId)")
        echo "appName=$APP_NAME" >> $GITHUB_OUTPUT
        echo "appId=$APP_ID" >> $GITHUB_OUTPUT
        echo "应用名: $APP_NAME"
        echo "Bundle ID: $APP_ID"

    - name: 编译 iOS 应用（Ad-hoc 签名，稳定编译）
      run: |
        xcodebuild -workspace "ios/App/App.xcworkspace" \
          -scheme "App" \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=YES \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          PRODUCT_BUNDLE_IDENTIFIER="${{ steps.config.outputs.appId }}" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          PROVISIONING_PROFILE=""

    - name: 打包 IPA（打包后直接从 ZIP 里删签名）
      run: |
        APP_ROOT="build/Build/Products/Release-iphoneos"
        APP_DIR=$(ls -d "$APP_ROOT"/*.app | head -n 1)
        echo "App 目录: $APP_DIR"

        # 复制到 Payload
        rm -rf Payload command-helper.ipa
        mkdir -p Payload
        cp -R "$APP_DIR" Payload/

        # 确保可执行权限
        APP_PATH=$(ls -d Payload/*.app | head -n 1)
        EXE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
        chmod +x "$APP_PATH/$EXE_NAME"
        if [ -d "$APP_PATH/Frameworks" ]; then
          find "$APP_PATH/Frameworks" -type f \( -name "*.dylib" -o -perm -u+x \) -exec chmod +x {} \; 2>/dev/null || true
        fi

        # 清除 macOS 扩展属性
        xattr -rc Payload 2>/dev/null || true

        # 先全部打包（签名残留没关系，之后直接从 zip 里删）
        zip -r -X -q command-helper.ipa Payload -x "*.DS_Store" "__MACOSX*"

        # ★ 暴力：打包完后直接从 zip 里删除所有签名相关文件
        echo "--- 从 zip 中删除签名残留 ---"
        zip -d command-helper.ipa "*_CodeSignature*" 2>/dev/null || true
        zip -d command-helper.ipa "*.mobileprovision" 2>/dev/null || true
        zip -d command-helper.ipa "*.entitlements" 2>/dev/null || true
        echo "删除完成"

        # 验证
        echo "--- 最终验证 ---"
        unzip -l command-helper.ipa | grep -i 'codesignature\|mobileprovision\|entitlements' || echo "✓ 无任何签名残留"
        ls -lh command-helper.ipa

    - name: 上传 IPA 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "命令助手-ios"
        path: command-helper.ipa
        retention-days: 30

    - name: 创建 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: command-helper.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
